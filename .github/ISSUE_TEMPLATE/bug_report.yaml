name: Bug Report
description: Report a bug to help us improve KrizRP
title: '[Bug]: '
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        **Before submitting a bug report**, please check existing issues to see if your bug is already reported.

  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: App Version
      description: What version of KrizRP are you running?
      placeholder: e.g., 1.0.0

  - type: input
    id: device
    validations:
      required: true
    attributes:
      label: Device & Android Version
      description: What is your device and Android version?
      placeholder: e.g., Pixel 8, Android 14

  - type: input
    id: provider
    attributes:
      label: AI Provider / Model (Optional)
      description: If this issue is model or provider related, specify it here
      placeholder: e.g., OpenRouter / Gemini 2.0 Flash / KoboldCPP

  - type: textarea
    id: description
    validations:
      required: true
    attributes:
      label: Description & Reproduction Steps
      description: Explain the bug in detail and steps to reproduce.
