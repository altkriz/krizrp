name: Feature Request
description: Suggest a new feature or improvement for KrizRP
title: '[Feature Request]: '
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        **Before submitting a feature request**, please search existing issues to see if your idea has already been proposed.

  - type: textarea
    id: description
    validations:
      required: true
    attributes:
      label: Feature Description
      description: A clear and concise description of what feature or enhancement you'd like.

  - type: textarea
    id: context
    attributes:
      label: Context / Motivation
      description: Why would this feature be useful for roleplay and character chat?
